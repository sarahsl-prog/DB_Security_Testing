server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html README.md index.htm;

    # Enable directory listing for documentation
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Serve markdown files as plain text
    location ~ \.md$ {
        default_type text/plain;
        charset utf-8;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
