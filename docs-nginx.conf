  server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html README.md index.htm;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Enable directory listing for documentation
    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Serve markdown files as plain text
    location ~ \.md$ {
       default_type text/plain;
       charset utf-8;
    }

    # Serve static files
    location / {
        try_files $uri $uri/ =404;
    }

    # Cache static files
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|pdf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API requests to Flask backend
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Security: Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Logging for security analysis
    access_log /var/log/nginx/healthcare_access.log;
    error_log /var/log/nginx/healthcare_error.log debug;
  }