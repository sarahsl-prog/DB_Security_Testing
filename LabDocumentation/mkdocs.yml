      - Quick Start: getting-started/quick-start.md
      - Prerequisites: getting-started/prerequisites.md
      - Installation Guide: INSTALL.md
      - Docker Quick Start: DOCKER_QUICKSTART.md
      - Quick Start (Scripts): QUICKSTART.md
  - Architecture:
      - Overview: architecture/overview.md
      - System Specifications: architecture/system-specifications.md
      - Lab Specifications: architecture/lab-specs-table.md
      - Specifications Details: architecture/specifications.md
      - Architecture Diagrams: architecture/diagrams.md
      - Security Layers: architecture/security-layers.md
      - Authentication: architecture/authentication.md
  - Host Configuration:
      - Frontend & Backend: hosts/frontend-backend.md
      - Database Host: hosts/database-host.md
      - LLM Host: hosts/llm-host.md
      - Network Configuration: hosts/network-config.md
  - Database:
      - Schema: database/schema.md
      - ERD: database/erd.md
      - Data Classification: database/data-classification.md
  - API Documentation:
      - Endpoints: api/endpoints.md
      - Authentication: api/authentication.md
      - Query Processing: api/query-processing.md
      - Error Handling: api/errors.md
  - Security:
      - Overview: security/overview.md
      - Security Testing: security/security-testing.md
      - Input Validation: security/input-validation.md
      - SQL Validation: security/sql-validation.md
      - Result Filtering: security/result-filtering.md
  - Testing:
      - Test Cases: testing/test-cases.md
  - Deployment:
      - Deployment Strategy: DEPLOYMENT_STRATEGY.md
      - Deployment Package: DEPLOYMENT_PACKAGE.md
  - Reference:
      - Commands: reference/commands.md
      - Ports & Services: reference/ports.md
  - Troubleshooting:
      - Common Issues: troubleshooting/common-issues.md
  - Research:
      - Research Documentation: research/research-readme.md

# Footer
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sarahsl-prog/DB_Security_Testing
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/sund-lussier
