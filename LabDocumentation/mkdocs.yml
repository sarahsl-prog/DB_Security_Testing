site_name: Healthcare Database Security Research Lab
site_description: Comprehensive documentation for the Healthcare Database Security Research Application
site_author: Sarah Sund-Lussier
site_url: https://github.com/sarahsl-prog/DB_Security_Testing

# Repository
repo_name: sarahsl-prog/DB_Security_Testing
repo_url: https://github.com/sarahsl-prog/DB_Security_Testing
edit_uri: edit/main/LabDocumentation/docs/

# Copyright
copyright: Copyright &copy; 2025 Sarah Sund-Lussier - Boston University CS 674

# Configuration
theme:
  name: readthedocs
  language: en

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - codehilite:
      guess_lang: false
  - fenced_code

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'

# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js

# Social links
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sarahsl-prog/DB_Security_Testing
      name: GitHub Repository

# Navigation
nav:
