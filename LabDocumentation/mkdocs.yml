site_name: Healthcare Database Security Research Lab
site_description: Comprehensive documentation for the Healthcare Database Security Research Application
site_author: Sarah Sund-Lussier
site_url: https://github.com/sarahsl-prog/DB_Security_Testing

# Repository
repo_name: sarahsl-prog/DB_Security_Testing
repo_url: https://github.com/sarahsl-prog/DB_Security_Testing
edit_uri: edit/main/LabDocumentation/docs/

# Copyright
copyright: Copyright &copy; 2025 Sarah Sund-Lussier - Boston University CS 674

# Configuration
theme:
  name: material
  language: en
  font:
    text: Exo 2          # Body text - modern & readable
    code: JetBrains Mono # Code blocks - professional & monospaced
  icon:
    repo: fontawesome/brands/github
  logo: images/logo-no-text.png
  favicon: images/logo-no-text.png
  palette:
  # Light mode
  - scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  # Dark mode
  - scheme: grey
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

 

# Plugins
plugins:
  - search:
      lang: en
      separator: '[\s\-,:!=\[\]()"/]+|(?!\b)(?=[A-Z][a-z])|\.(?!\d)|&[lg]t;'
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      type: date
      fallback_to_build_date: true

      
# Extra CSS
extra_css:
  - stylesheets/extra.css

# Extra JavaScript
extra_javascript:
  - javascripts/extra.js


# Navigation
