### Healthcare Database Security Research Lab
### Example nginx configuration file
### file location  /etc/nginx/sites-available/healthcare-api
### nginx
  server {
      listen 80;
      listen [::]:80;

      server_name healthcare-api.com www.healthcare-api.com;

      root /var/www/healthcare-api;
      index index.html index.htm;

      # Security headers
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header X-XSS-Protection "1; mode=block" always;
      add_header X-Content-Type-Options "nosniff" always;

      # Serve static files
      location / {
          try_files $uri $uri/ =404;
      }

      # Proxy API requests to Flask backend
      location /api/ {
          proxy_pass http://127.0.0.1:5000;
          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
          proxy_connect_timeout 30s;
          proxy_send_timeout 30s;
          proxy_read_timeout 30s;
      }

      # Security: Deny access to hidden files
      location ~ /\. {
          deny all;
      }

      # Logging for security analysis
      access_log /var/log/nginx/healthcare_access.log;
      error_log /var/log/nginx/healthcare_error.log debug;
  }
