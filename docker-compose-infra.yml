services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthcare_pass_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/setup_database.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_security"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - healthcare_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    build: ./ollama
    container_name: healthcare_llm
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - healthcare_network
    restart: unless-stopped
    # GPU support (optional): Uncomment the section below if you have an NVIDIA GPU
    # This will significantly speed up LLM inference
    # Prerequisites: nvidia-docker installed (https://github.com/NVIDIA/nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]


# Data Generator Service to populate the database with generated data
data-generator:
  build: ./data-generator
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    - DATABASE_URL=postgresql://dbuser:dbpass@postgres:5432/healthcare
  networks:
    - healthcare_network
  profiles:
    - tools
networks:
    healthcare_network:
      driver: bridge

volumes:
  postgres_data:
      driver: local
  ollama_data:
      driver: local
