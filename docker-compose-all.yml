services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthcare_pass_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/setup_database.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_security"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - healthcare_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    build: ./ollama
    container_name: healthcare_llm
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - healthcare_network
    restart: unless-stopped
    # GPU support (optional): Uncomment the section below if you have an NVIDIA GPU
    # This will significantly speed up LLM inference
    # Prerequisites: nvidia-docker installed (https://github.com/NVIDIA/nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]


  backend:
    build:
      context: ./backend
    container_name: healthcare_backend
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${BACKEND_PORT:-5000}
      DB_HOST: postgres
      DB_NAME: healthcare_security
      DB_USER: healthcare_user
      LLM_HOST: ollama
      LLM_PORT: ${LLM_PORT:-11434}
      LOG_DIR: /app/logs
      DATABASE_URL: postgresql://healthcare_user:${DB_PASSWORD:-healthcare_pass_change_me}@postgres:5432/healthcare_security
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - healthcare_network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_HOST: ${FRONTEND_BACKEND_HOST:-localhost}
        VITE_BACKEND_PORT: ${BACKEND_PORT:-5000}
    container_name: healthcare_frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      NGINX_PORT: 80
      BACKEND_URL: http://${FRONTEND_BACKEND_HOST:-localhost}:${BACKEND_PORT:-5000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - healthcare_network

# Data Generator Service to populate the database with generated data
  data-generator:
    build: ./data-generator
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://healthcare_user:Postgresql17!@postgres:5432/healthcare_security
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=healthcare_user
      - DB_PASSWORD=Postgresql17!
      - DB_NAME=healthcare_security
      - DATABASE_PASSWORD=Postgresql17!  # sometimes needed too
      - SECRET_KEY=dev-secret-key-change-in-prod
    networks:
    - healthcare_network
    profiles:
    - tools

networks:
    healthcare_network:
      driver: bridge

volumes:
  postgres_data:
      driver: local
  ollama_data:
      driver: local
