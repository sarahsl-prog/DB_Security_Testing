
services:
  backend:
    build:
      context: ./backend
    container_name: healthcare_backend
    env_file:
      - .env
    environment:
      API_HOST: 0.0.0.0
      API_PORT: ${BACKEND_PORT:-5000}
      DB_HOST: postgres
      DB_NAME: healthcare_security
      DB_USER: healthcare_user
      LLM_HOST: ollama
      LLM_PORT: ${LLM_PORT:-11434}
      LOG_DIR: /app/logs
      DATABASE_URL: postgresql://healthcare_user:${DB_PASSWORD:-healthcare_pass_change_me}@postgres:5432/healthcare_security
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - healthcare_network

  frontend:
    build:
      context: ./frontend
      args:
        VITE_BACKEND_HOST: ${FRONTEND_BACKEND_HOST:-localhost}
        VITE_BACKEND_PORT: ${BACKEND_PORT:-5000}
    container_name: healthcare_frontend
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    environment:
      NGINX_PORT: 80
      BACKEND_URL: http://${FRONTEND_BACKEND_HOST:-localhost}:${BACKEND_PORT:-5000}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - healthcare_network

networks:
  healthcare_network:
    external: true