version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: healthcare_db
    environment:
      POSTGRES_DB: healthcare_security
      POSTGRES_USER: healthcare_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:-healthcare_pass_change_me}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/setup_database.sql:/docker-entrypoint-initdb.d/setup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U healthcare_user -d healthcare_security"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - healthcare_network
    restart: unless-stopped

  # Ollama LLM Service
  ollama:
    image: ollama/ollama:latest
    container_name: healthcare_llm
    ports:
      - "${LLM_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - healthcare_network
    restart: unless-stopped
    # GPU support (optional): Uncomment the section below if you have an NVIDIA GPU
    # This will significantly speed up LLM inference
    # Prerequisites: nvidia-docker installed (https://github.com/NVIDIA/nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # Backend API (Flask)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: healthcare_backend
    environment:
      # Database
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: healthcare_security
      DB_USER: healthcare_user
      DB_PASSWORD: ${DB_PASSWORD:-healthcare_pass_change_me}

      # LLM Service
      LLM_HOST: ollama
      LLM_PORT: 11434
      LLM_MODEL: ${LLM_MODEL:-llama3.1-sql:latest}

      # API Configuration
      API_HOST: 0.0.0.0
      API_PORT: 5000
      FLASK_ENV: ${FLASK_ENV:-development}
      FLASK_DEBUG: ${FLASK_DEBUG:-False}

      # Security
      SECURITY_MODE: ${SECURITY_MODE:-vulnerable}
      SECRET_KEY: ${SECRET_KEY:-dev-key-change-in-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-jwt-key-change-in-production}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    volumes:
      - ./backend/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - healthcare_network
    restart: unless-stopped

  # Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_HOST=${BACKEND_HOST:-localhost}
        - VITE_BACKEND_PORT=${BACKEND_PORT:-5000}
    container_name: healthcare_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - healthcare_network
    restart: unless-stopped

  # Documentation (Optional)
  docs:
    image: nginx:alpine
    container_name: healthcare_docs
    ports:
      - "${DOCS_PORT:-8080}:80"
    volumes:
      - ./LabDocumentation:/usr/share/nginx/html:ro
      - ./docs-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - healthcare_network
    restart: unless-stopped
    profiles:
      - docs  # Only starts if explicitly requested

networks:
  healthcare_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  ollama_data:
    driver: local
